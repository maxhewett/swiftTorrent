<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>swiftTorrent Updates</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f1;
      --card: rgba(255, 255, 255, 0.82);
      --ink: #102018;
      --muted: #4d5f55;
      --accent: #0f8a5f;
      --line: rgba(16, 32, 24, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Iowan Old Style", "Palatino Linotype", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(15, 138, 95, 0.18), transparent 30%),
        radial-gradient(circle at bottom right, rgba(12, 82, 143, 0.12), transparent 28%),
        linear-gradient(160deg, #eef4ee, var(--bg));
      padding: 24px;
    }
    main {
      width: min(680px, 100%);
      background: var(--card);
      backdrop-filter: blur(10px);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 24px 60px rgba(16, 32, 24, 0.12);
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 0.95;
      letter-spacing: -0.03em;
    }
    p {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 1.05rem;
    }
    a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }
    code {
      font-family: "SF Mono", Menlo, monospace;
      font-size: 0.95em;
    }
  </style>
</head>
<body>
  <main>
    <h1>swiftTorrent Updates</h1>
    <p>This site hosts the Sparkle appcast feed for swiftTorrent.</p>
    <p>Feed URL: <a href="./appcast.xml"><code>appcast.xml</code></a></p>
  </main>
</body>
</html>
