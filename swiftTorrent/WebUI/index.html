<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>swiftTorrent WebUI</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #10151b;
        --bg-soft: #151d25;
        --panel: rgba(31, 39, 48, 0.86);
        --panel-strong: rgba(39, 48, 58, 0.96);
        --panel-soft: rgba(255, 255, 255, 0.055);
        --stroke: rgba(255, 255, 255, 0.105);
        --text: #eef4f8;
        --muted: rgba(238, 244, 248, 0.68);
        --faint: rgba(238, 244, 248, 0.42);
        --accent: #44c878;
        --accent-2: #72e5a2;
        --blue: #63b9ff;
        --warn: #ffd37a;
        --danger: #ff7b7b;
        --shadow: 0 24px 80px rgba(0, 0, 0, 0.34);
        --radius-xl: 24px;
        --radius-lg: 17px;
        --radius-md: 13px;
      }

      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --bg: #eef2f4;
          --bg-soft: #f7f9fb;
          --panel: rgba(255, 255, 255, 0.82);
          --panel-strong: rgba(255, 255, 255, 0.96);
          --panel-soft: rgba(28, 43, 58, 0.055);
          --stroke: rgba(20, 35, 52, 0.115);
          --text: #111820;
          --muted: rgba(17, 24, 32, 0.65);
          --faint: rgba(17, 24, 32, 0.42);
          --shadow: 0 20px 60px rgba(69, 91, 115, 0.18);
        }
      }

      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        font-family: ui-rounded, "SF Pro Rounded", "SF Pro Text", system-ui, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 18% 0%, rgba(68, 200, 120, 0.18), transparent 32vw),
          radial-gradient(circle at 96% 6%, rgba(99, 185, 255, 0.16), transparent 34vw),
          linear-gradient(145deg, var(--bg), var(--bg-soft));
      }
      button, select, input { font: inherit; color: inherit; }
      button { -webkit-tap-highlight-color: transparent; }
      h1, h2, h3, p { margin: 0; }

      .app {
        min-height: 100vh;
        padding: 14px;
        display: grid;
        grid-template-columns: minmax(620px, 1fr) 360px;
        gap: 12px;
      }
      .pane {
        min-height: calc(100vh - 28px);
        background: linear-gradient(180deg, var(--panel-strong), var(--panel));
        border: 1px solid var(--stroke);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow);
        overflow: hidden;
        backdrop-filter: blur(24px) saturate(145%);
        -webkit-backdrop-filter: blur(24px) saturate(145%);
      }
      .content, .inspector { display: flex; flex-direction: column; min-width: 0; }

      .topbar {
        padding: 13px 14px;
        display: flex;
        align-items: center;
        gap: 10px;
        border-bottom: 1px solid var(--stroke);
      }
      .app-icon { width: 34px; height: 34px; border-radius: 10px; overflow: hidden; background: var(--panel-soft); flex: 0 0 auto; }
      .app-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .title-block { min-width: 0; }
      .title-block h1 { font-size: 17px; letter-spacing: -0.02em; }
      .title-block p { font-size: 12px; color: var(--muted); margin-top: 1px; }
      .spacer { flex: 1; }

      .button, .icon-button, .select, .search {
        border: 1px solid var(--stroke);
        border-radius: 12px;
        background: var(--panel-soft);
        color: inherit;
        min-height: 34px;
      }
      .button { padding: 8px 11px; cursor: pointer; font-weight: 750; font-size: 12px; }
      .button.primary { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 30%, transparent), var(--panel-soft)); }
      .button.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 36%, var(--stroke)); }
      .icon-button { width: 34px; display: grid; place-items: center; cursor: pointer; }
      .select { padding: 8px 28px 8px 10px; width: 100%; }
      .search { padding: 9px 11px; width: 100%; outline: none; }
      .search:focus { border-color: color-mix(in srgb, var(--accent) 55%, var(--stroke)); }

      .summary-grid { padding: 12px; display: grid; grid-template-columns: repeat(4, minmax(92px, 1fr)); gap: 8px; }
      .metric { padding: 10px; border-radius: var(--radius-md); border: 1px solid var(--stroke); background: var(--panel-soft); }
      .metric-label { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
      .metric-value { margin-top: 3px; font-size: 17px; font-weight: 800; letter-spacing: -0.02em; }

      .filterbar { padding: 0 12px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
      .segmented { display: inline-flex; padding: 3px; border: 1px solid var(--stroke); border-radius: 13px; background: var(--panel-soft); gap: 3px; }
      .segmented button { border: 0; border-radius: 10px; padding: 7px 9px; background: transparent; cursor: pointer; color: var(--muted); font-size: 12px; }
      .segmented button.active { background: color-mix(in srgb, var(--accent) 24%, transparent); color: var(--text); }

      .list-scroll, .inspector-scroll { min-height: 0; overflow: auto; }
      .list-scroll { padding: 0 10px 12px; }
      .section-label {
        position: sticky;
        top: 0;
        z-index: 1;
        padding: 10px 7px 7px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        background: linear-gradient(180deg, var(--panel-strong), color-mix(in srgb, var(--panel-strong) 80%, transparent));
      }

      .torrent-row {
        width: 100%;
        border: 1px solid transparent;
        border-radius: 16px;
        background: transparent;
        color: inherit;
        display: grid;
        grid-template-columns: 42px minmax(0, 1fr) minmax(180px, 0.34fr) auto;
        gap: 10px;
        align-items: center;
        padding: 8px;
        text-align: left;
        cursor: pointer;
      }
      .torrent-row:hover { background: var(--panel-soft); }
      .torrent-row.selected { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 18%, transparent), var(--panel-soft)); border-color: color-mix(in srgb, var(--accent) 34%, var(--stroke)); }
      .poster { width: 42px; height: 62px; border-radius: 10px; display: grid; place-items: center; overflow: hidden; border: 1px solid var(--stroke); background: var(--panel-soft); color: var(--faint); font-size: 17px; }
      .poster.big { width: 72px; height: 108px; border-radius: 13px; font-size: 24px; }
      .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .row-title { font-size: 13px; font-weight: 800; line-height: 1.22; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
      .row-subtitle { margin-top: 3px; font-size: 11px; color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .row-progress, .progress { overflow: hidden; border-radius: 999px; background: color-mix(in srgb, var(--text) 9%, transparent); }
      .row-progress { height: 4px; margin-top: 7px; }
      .progress { height: 8px; }
      .row-progress span, .progress span { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width 180ms ease; }
      .row-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 10px; color: var(--muted); font-size: 11px; }
      .row-right { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; font-size: 11px; color: var(--muted); }

      .pill { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--stroke); background: var(--panel-soft); border-radius: 999px; padding: 5px 8px; color: var(--muted); font-size: 11px; line-height: 1; white-space: nowrap; }
      .pill.good { color: var(--accent-2); border-color: color-mix(in srgb, var(--accent) 30%, var(--stroke)); }
      .pill.warn { color: var(--warn); }
      .pill.blue { color: var(--blue); }
      .pill.danger { color: var(--danger); }

      .inspector-scroll { padding: 13px; }
      .media-head { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 12px; align-items: start; }
      .media-title { font-size: 20px; letter-spacing: -0.035em; line-height: 1.08; font-weight: 850; }
      .torrent-name { margin-top: 6px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; overflow-wrap: anywhere; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
      .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
      .toolbar .select { grid-column: 1 / -1; }
      .card { margin-top: 12px; padding: 12px; border: 1px solid var(--stroke); border-radius: var(--radius-lg); background: var(--panel-soft); }
      .card-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
      .card-header h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
      .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .stat { border: 1px solid var(--stroke); border-radius: var(--radius-md); padding: 9px; background: color-mix(in srgb, var(--panel-soft) 70%, transparent); }
      .stat div:first-child { color: var(--faint); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
      .stat div:last-child { margin-top: 4px; font-weight: 800; font-size: 14px; }
      .file-list { display: flex; flex-direction: column; gap: 7px; max-height: 330px; overflow: auto; padding-right: 2px; }
      .file-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px; border-radius: 12px; border: 1px solid var(--stroke); background: color-mix(in srgb, var(--panel-soft) 72%, transparent); }
      .file-row.skipped { opacity: 0.58; }
      .file-title { font-size: 12px; font-weight: 750; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .file-meta { margin-top: 5px; color: var(--muted); font-size: 11px; display: flex; gap: 7px; flex-wrap: wrap; }
      .file-actions { display: flex; gap: 6px; }
      .empty { min-height: 260px; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 24px; }
      .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(18px); opacity: 0; pointer-events: none; border: 1px solid var(--stroke); border-radius: 999px; padding: 10px 14px; background: var(--panel-strong); box-shadow: var(--shadow); transition: opacity 180ms ease, transform 180ms ease; z-index: 20; font-size: 13px; }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

      @media (max-width: 980px) {
        .app { grid-template-columns: minmax(0, 1fr) 330px; }
        .torrent-row { grid-template-columns: 42px minmax(0, 1fr) auto; }
        .row-stats { display: none; }
      }
      @media (max-width: 760px) {
        .app { min-height: 100dvh; padding: 0; display: block; }
        .pane { min-height: auto; border-radius: 0; box-shadow: none; border-left: 0; border-right: 0; }
        .content { min-height: 48dvh; max-height: 52dvh; border-bottom-left-radius: 22px; border-bottom-right-radius: 22px; }
        .inspector { min-height: 48dvh; margin-top: 8px; border-top-left-radius: 22px; border-top-right-radius: 22px; }
        .summary-grid { grid-template-columns: repeat(4, minmax(82px, 1fr)); overflow-x: auto; }
        .filterbar { grid-template-columns: 1fr; }
        .segmented { overflow-x: auto; }
        .torrent-row { grid-template-columns: 38px minmax(0, 1fr) auto; }
        .poster { width: 38px; height: 56px; }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="pane content">
        <div class="topbar">
          <div class="app-icon"><img src="/api/app-icon" alt="swiftTorrent"></div>
          <div class="title-block"><h1>swiftTorrent</h1><p id="refresh-note">Connecting…</p></div>
          <div class="spacer"></div>
          <span class="pill" id="selected-count">0 torrents</span>
        </div>
        <div class="summary-grid" id="summary-grid"></div>
        <div class="filterbar">
          <input class="search" id="search" type="search" placeholder="Search torrents" autocomplete="off">
          <div class="segmented" id="filter-tabs">
            <button data-filter="all" class="active">All</button>
            <button data-filter="downloading">Down</button>
            <button data-filter="seeding">Seed</button>
            <button data-filter="paused">Paused</button>
          </div>
        </div>
        <div class="list-scroll" id="torrent-list"></div>
      </section>

      <aside class="pane inspector" id="inspector-pane">
        <div class="empty"><div><h2>Select a torrent</h2><p style="margin-top:8px">Pick something from the list to inspect and manage it.</p></div></div>
      </aside>
    </main>
    <div class="toast" id="toast"></div>

    <script>
      const state = { snapshot: null, selectedTorrentID: null, selectedFilter: "all", search: "", detail: null, renderedListKey: null, renderedInspectorKey: null };
      const els = { list: document.getElementById("torrent-list"), inspector: document.getElementById("inspector-pane"), summary: document.getElementById("summary-grid"), refresh: document.getElementById("refresh-note"), search: document.getElementById("search"), tabs: document.getElementById("filter-tabs"), toast: document.getElementById("toast"), count: document.getElementById("selected-count") };
      const esc = (v) => String(v ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#39;");
      const attr = (v) => esc(v).replaceAll("`", "&#96;");
      const qs = (extra = {}) => new URLSearchParams({ v: state.snapshot?.webRevision || "boot", ...extra }).toString();
      const bytes = (b) => { const n = Number(b || 0); if (n >= 1024 ** 3) return `${(n / 1024 ** 3).toFixed(n >= 10 * 1024 ** 3 ? 1 : 2)} GB`; if (n >= 1024 ** 2) return `${(n / 1024 ** 2).toFixed(1)} MB`; if (n >= 1024) return `${Math.round(n / 1024)} KB`; return `${n} B`; };
      const rate = (b) => { const n = Number(b || 0); if (n >= 1024 ** 2) return `${(n / 1024 ** 2).toFixed(1)} MB/s`; if (n >= 1024) return `${Math.round(n / 1024)} KB/s`; return `${n} B/s`; };
      const pct = (v) => Math.round(Number(v || 0) * 100);
      const poster = (url, title = "") => url ? `<img src="${attr(url)}" alt="${attr(title)}" loading="lazy">` : "◌";
      const title = (t) => t.metadata?.title || t.name;
      const subtitle = (t) => t.metadata ? `${t.metadata.type === "movie" ? "Movie" : "TV Show"}${t.metadata.year ? ` • ${t.metadata.year}` : ""}${t.metadata.displaySuffix ? ` • ${t.metadata.displaySuffix}` : ""}` : (t.categoryTitle || "Unmatched");
      function pill(t) { if (t.isBoosted) return `<span class="pill good">Boosted</span>`; if (t.isQueued) return `<span class="pill warn">Queued</span>`; if (t.isPaused) return `<span class="pill warn">Paused</span>`; if (t.isSeeding) return `<span class="pill good">Seeding</span>`; return `<span class="pill blue">${esc(t.stateLabel || "Active")}</span>`; }
      function visible() { const all = state.snapshot?.torrents || []; const q = state.search.trim().toLowerCase(); return all.filter((t) => { if (state.selectedFilter === "downloading" && (t.isPaused || t.isSeeding || t.progress >= 0.999)) return false; if (state.selectedFilter === "seeding" && !t.isSeeding) return false; if (state.selectedFilter === "paused" && !t.isPaused) return false; if (!q) return true; return [t.name, t.categoryTitle, t.metadata?.title, t.metadata?.displaySuffix].filter(Boolean).join(" ").toLowerCase().includes(q); }); }
      function renderSummary() { const ts = state.snapshot?.torrents || []; const active = ts.filter((t) => !t.isPaused && !t.isSeeding && t.progress < 0.999); const down = ts.reduce((s, t) => s + Number(t.downBps || 0), 0); const up = ts.reduce((s, t) => s + Number(t.upBps || 0), 0); els.count.textContent = `${ts.length} torrent${ts.length === 1 ? "" : "s"}`; els.summary.innerHTML = [["Active", active.length], ["Down", rate(down)], ["Up", rate(up)], ["Total", ts.length]].map(([l, v]) => `<div class="metric"><div class="metric-label">${l}</div><div class="metric-value">${esc(v)}</div></div>`).join(""); }
      function groups(ts) { const defs = Object.fromEntries((state.snapshot?.categories || []).map((c) => [c.id, c])); const out = []; for (const id of ["tv", "movie"]) { const items = ts.filter((t) => t.category === id); if (items.length) out.push({ title: defs[id]?.title || (id === "tv" ? "TV" : "Movies"), items }); } const other = ts.filter((t) => t.category !== "tv" && t.category !== "movie"); if (other.length) out.push({ title: "Other", items: other }); return out; }
      function renderList() { const ts = visible(); const key = JSON.stringify({ ids: ts.map((t) => [t.id, t.progress, t.isPaused, t.isSeeding, t.isBoosted, t.isQueued, t.downBps, t.upBps, t.metadata?.title, t.metadata?.posterURL]), selected: state.selectedTorrentID, q: state.search, f: state.selectedFilter }); if (key === state.renderedListKey) return; state.renderedListKey = key; if (!ts.length) { els.list.innerHTML = `<div class="empty"><div><h2>No matches</h2><p style="margin-top:8px">Try another filter or search.</p></div></div>`; return; } els.list.innerHTML = groups(ts).map((g) => `<div class="section-label">${esc(g.title)} · ${g.items.length}</div>${g.items.map(row).join("")}`).join(""); els.list.querySelectorAll("[data-select]").forEach((b) => b.addEventListener("click", () => selectTorrent(b.dataset.select))); }
      function row(t) { const p = pct(t.progress); return `<button class="torrent-row ${t.id === state.selectedTorrentID ? "selected" : ""}" data-select="${attr(t.id)}"><div class="poster">${poster(t.metadata?.posterURL, title(t))}</div><div style="min-width:0"><div class="row-title">${esc(title(t))}</div><div class="row-subtitle">${esc(subtitle(t))}</div><div class="row-progress"><span style="width:${p}%"></span></div></div><div class="row-stats"><span>↓ ${esc(rate(t.downBps))}</span><span>↑ ${esc(rate(t.upBps))}</span><span>${esc(bytes(t.totalWantedDone))}</span><span>${esc(bytes(t.totalWanted))}</span></div><div class="row-right"><strong>${p}%</strong>${pill(t)}</div></button>`; }
      function selectedSummary() { return (state.snapshot?.torrents || []).find((t) => t.id === state.selectedTorrentID) || null; }
      function categorySelect(current) { const cats = state.snapshot?.categories || []; return `<select class="select" id="category-select"><option value="">No category</option>${cats.map((c) => `<option value="${attr(c.id)}" ${current === c.id ? "selected" : ""}>${esc(c.title)}</option>`).join("")}</select>`; }
      function renderInspector(detail) { const t = detail?.torrent || selectedSummary(); if (!t) { state.renderedInspectorKey = null; els.inspector.innerHTML = `<div class="empty"><div><h2>Select a torrent</h2><p style="margin-top:8px">Pick something from the list to inspect and manage it.</p></div></div>`; return; } const files = detail?.files || []; const meta = detail?.metadata || t.metadata || null; const p = pct(t.progress); const key = JSON.stringify({ t, meta, files: files.map((f) => [f.id, f.path, f.progress, f.isSkipped, f.isPrioritized]), lookup: detail?.metadataLookupState }); if (key === state.renderedInspectorKey) return; state.renderedInspectorKey = key; els.inspector.innerHTML = `<div class="topbar"><div class="title-block"><h1>Inspector</h1><p>${esc(t.stateLabel || "Ready")}</p></div><div class="spacer"></div>${pill(t)}</div><div class="inspector-scroll"><section class="media-head"><div class="poster big">${poster(meta?.posterURL, title(t))}</div><div style="min-width:0"><div class="media-title">${esc((meta?.title || t.name) + (meta?.year ? ` (${meta.year})` : ""))}</div><div class="torrent-name">${esc(t.name)}</div><div class="chips">${t.categoryTitle ? `<span class="pill">${esc(t.categoryTitle)}</span>` : ""}${meta?.type ? `<span class="pill">${meta.type === "movie" ? "Movie" : "TV Show"}</span>` : ""}${meta?.displaySuffix ? `<span class="pill">${esc(meta.displaySuffix)}</span>` : ""}</div></div></section><div class="toolbar"><button class="button primary" data-action="${t.isPaused ? "resume" : "pause"}">${t.isPaused ? "Resume" : "Pause"}</button><button class="button" data-action="boost">${t.isBoosted ? "Unboost" : "Boost"}</button><button class="button" data-action="cleanup">Organize</button><button class="button danger" data-action="remove">Remove</button>${categorySelect(t.category)}</div><section class="card"><div class="card-header"><h3>Transfer</h3><span class="pill">${p}%</span></div><div class="stats"><div class="stat"><div>Done</div><div>${esc(bytes(t.totalWantedDone))}</div></div><div class="stat"><div>Total</div><div>${esc(bytes(t.totalWanted))}</div></div><div class="stat"><div>Down</div><div>${esc(rate(t.downBps))}</div></div><div class="stat"><div>Up</div><div>${esc(rate(t.upBps))}</div></div></div><div class="progress" style="margin-top:12px"><span style="width:${p}%"></span></div></section><section class="card"><div class="card-header"><h3>Files</h3><span class="pill">${files.length} files</span></div>${files.length ? `<div class="file-list">${files.map(fileRow).join("")}</div>` : `<p style="color:var(--faint);font-size:12px">No file list available yet.</p>`}</section></div>`; els.inspector.querySelectorAll("[data-action]").forEach((el) => el.addEventListener("click", () => handleAction(t, el.dataset.action))); const select = document.getElementById("category-select"); if (select) select.addEventListener("change", () => runAction(t.id, "setCategory", { category: select.value || null })); els.inspector.querySelectorAll("[data-file-wanted]").forEach((el) => el.addEventListener("click", () => runAction(t.id, "setFileWanted", { fileID: Number(el.dataset.fileWanted), wanted: el.dataset.wanted === "true" }))); els.inspector.querySelectorAll("[data-file-priority]").forEach((el) => el.addEventListener("click", () => runAction(t.id, "setFilePriority", { fileID: Number(el.dataset.filePriority), prioritized: el.dataset.prioritized === "true" }))); }
      function fileRow(f) { const name = f.path.split(/[\\/]/).pop(); const p = pct(f.progress); return `<div class="file-row ${f.isSkipped ? "skipped" : ""}"><div style="min-width:0"><div class="file-title">${esc(name)}</div><div class="file-meta"><span>${p}%</span><span>${esc(bytes(f.done))} / ${esc(bytes(f.size))}</span>${f.isPrioritized ? "<span>Priority</span>" : ""}${f.isSkipped ? "<span>Skipped</span>" : ""}</div></div><div class="file-actions"><button class="icon-button" title="${f.isPrioritized ? "Normal priority" : "Prioritize"}" data-file-priority="${f.id}" data-prioritized="${!f.isPrioritized}" ${f.isSkipped ? "disabled" : ""}>★</button><button class="icon-button" title="${f.isSkipped ? "Include" : "Skip"}" data-file-wanted="${f.id}" data-wanted="${f.isSkipped}">${f.isSkipped ? "↓" : "⊘"}</button></div></div>`; }
      async function handleAction(t, action) { if (action === "remove") { const deleteFiles = window.confirm("Delete downloaded files too?\n\nOK deletes files. Cancel only removes the torrent from the list."); await runAction(t.id, "remove", { deleteFiles }); return; } await runAction(t.id, action); }
      async function runAction(id, action, extra = {}) { const response = await fetch(`/api/torrent/action?${qs({ id })}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action, ...extra }) }); if (!response.ok) { showToast(await response.text() || `Action failed: ${response.status}`); return; } showToast("Updated"); await tick(); }
      function showToast(message) { els.toast.textContent = message; els.toast.classList.add("show"); clearTimeout(showToast.timer); showToast.timer = setTimeout(() => els.toast.classList.remove("show"), 1500); }
      async function selectTorrent(id) { state.selectedTorrentID = id; state.renderedListKey = null; state.renderedInspectorKey = null; renderList(); await fetchDetail(); }
      async function fetchState() { const response = await fetch("/api/state", { cache: "no-store" }); if (!response.ok) throw new Error(`State failed: ${response.status}`); state.snapshot = await response.json(); const torrents = state.snapshot.torrents || []; if (!torrents.length) state.selectedTorrentID = null; else if (!state.selectedTorrentID || !torrents.some((t) => t.id === state.selectedTorrentID)) state.selectedTorrentID = torrents[0].id; els.refresh.textContent = `Updated ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" })}`; renderSummary(); renderList(); }
      async function fetchDetail() { if (!state.selectedTorrentID) { renderInspector(null); return; } const response = await fetch(`/api/torrent?${qs({ id: state.selectedTorrentID })}`, { cache: "no-store" }); if (!response.ok) throw new Error(`Detail failed: ${response.status}`); state.detail = await response.json(); renderInspector(state.detail); }
      async function tick() { try { await fetchState(); await fetchDetail(); } catch (error) { showToast(error.message); } }
      els.search.addEventListener("input", () => { state.search = els.search.value; state.renderedListKey = null; renderList(); });
      els.tabs.addEventListener("click", (event) => { const button = event.target.closest("button[data-filter]"); if (!button) return; state.selectedFilter = button.dataset.filter; els.tabs.querySelectorAll("button").forEach((item) => item.classList.toggle("active", item === button)); state.renderedListKey = null; renderList(); });
      tick();
      setInterval(tick, 2500);
    </script>
  </body>
</html>
